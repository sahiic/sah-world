name: Reliability checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reliability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  journal-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Check Quran social UI with an isolated fixture backend
        run: npx playwright test --config=playwright.social.config.ts
      - name: Install pinned isolated PostgreSQL test runtime
        run: npm install --prefix "${{ runner.temp }}/quran-pglite" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.8
      - name: Check Quran migration and authorization rules locally
        env:
          QURAN_PGLITE_ROOT: ${{ runner.temp }}/quran-pglite
        run: |
          node scripts/test-quran-database.cjs
          node scripts/test-quran-social-database.cjs
      - run: npm run build
      # Traces contain test-only synthetic text. Never run these tests with real personal data.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: journal-ui-failures
          path: |
            playwright-report/
            test-results/
          retention-days: 3
